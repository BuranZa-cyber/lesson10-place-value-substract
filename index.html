<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>520 000 − 180 000</title>
<style>
:root{color-scheme:light;--ink:#222b43;--purple:#6945a7;--blue:#2565a6;--border:#d8e2ee}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink)}
main{max-width:510px;margin:0 auto;border:1px solid var(--border);border-radius:18px;padding:24px 16px 20px;background:#fff}
.column{width:min(100%,340px);margin:auto;display:grid;grid-template-columns:36px 1fr;row-gap:4px;align-items:center}
.symbol{font-weight:800;text-align:center;font-size:32px;line-height:1}
.number{display:flex;gap:4px;justify-content:center;align-items:center;font-variant-numeric:tabular-nums}
.group{font-size:clamp(33px,8vw,47px);font-weight:790;letter-spacing:1px;min-width:0;padding:6px 9px;text-align:center;border-radius:10px}
.thousands{background:#eee5fc;color:#5a368f}
.units{background:#e5f1ff;color:#1b5d98}
.rule{grid-column:1/-1;border-top:4px solid #34445e;margin:10px 0 10px}
.answer-row{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0}
#answer{width:min(100%,235px);height:72px;border:2px solid #b7c7dc;background:#fff;border-radius:12px;outline:0;font:750 clamp(30px,7vw,40px)/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);text-align:center;letter-spacing:1px;font-variant-numeric:tabular-nums}
#answer::placeholder{color:#aebbd0}
#answer:focus{border-color:#6479e2;box-shadow:0 0 0 3px #6479e222}
#answer.error{border-color:#e05b62;background:#fff3f3}
#answer.correct{border-color:#27945d;background:#edf9f0}
button{cursor:pointer;display:grid;place-items:center;flex:0 0 65px;height:65px;border:none;border-radius:14px;background:#3478cf;color:white;font:bold 38px/1 system-ui,-apple-system,Segoe UI,Arial,sans-serif;touch-action:manipulation}
button:hover{background:#2468bf}button:active{transform:scale(.97)}button:focus-visible{outline:3px solid #ca8d12;outline-offset:3px}
#result{grid-column:1/-1;min-height:36px;text-align:center;font-size:31px;font-weight:850;line-height:36px;color:#2b9666;margin-top:7px}
#result.bad{color:#df5261}
@media(max-width:420px){main{padding:16px 8px}.column{grid-template-columns:29px 1fr;width:min(100%,315px)}.group{padding:7px 6px;font-size:clamp(28px,8.1vw,39px)}#answer{width:min(100%,215px);height:62px}button{height:60px;flex-basis:60px}}
</style>
</head>
<body>
<main>
  <form id="exercise" autocomplete="off" novalidate>
    <div class="column">
      <span class="symbol" aria-hidden="true"></span>
      <div class="number" aria-label="520000"><span class="group thousands">520</span><span class="group units">000</span></div>
      <span class="symbol" aria-hidden="true">−</span>
      <div class="number" aria-label="180000"><span class="group thousands">180</span><span class="group units">000</span></div>
      <div class="rule" aria-hidden="true"></div>
      <span class="symbol" aria-hidden="true">=</span>
      <div class="answer-row">
        <input id="answer" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="?" aria-label="Result" autocomplete="off" spellcheck="false" autocapitalize="off">
        <button type="submit" aria-label="Check">✓</button>
      </div>
      <div id="result" role="status" aria-live="polite"></div>
    </div>
  </form>
</main>
<script>
(()=>{
'use strict';
const form=document.getElementById('exercise');
const input=document.getElementById('answer');
const result=document.getElementById('result');
input.addEventListener('input',()=>{input.value=input.value.replace(/[^0-9]/g,'').slice(0,6);input.classList.remove('error','correct');result.textContent='';result.className='';});
form.addEventListener('submit',(event)=>{
 event.preventDefault();
 const correct=input.value==='340000';
 input.classList.toggle('correct',correct);
 input.classList.toggle('error',!correct);
 result.textContent=correct?'✓':'×';
 result.className=correct?'':'bad';
});
})();
</script>
</body>
</html>
